<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Morgenbriefing</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Semi+Condensed:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--g2:#f5d77a}
body{margin:0;background:radial-gradient(circle at 50% 20%,#1a1608,#000 70%);color:#eee;font-family:'Saira Semi Condensed',sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:'Saira Stencil One';color:var(--g);letter-spacing:3px;text-align:center;font-size:30px;margin:6px 0}
.t{font-family:'Share Tech Mono';text-align:center;color:var(--g2);opacity:.8}
.ring{width:150px;height:150px;margin:26px auto;border:2px solid var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 0 25px #d4af3755;animation:p 2.4s infinite}
.ring:before{content:'';position:absolute;inset:12px;border:1px dashed var(--g);border-radius:50%;animation:r 12s linear infinite}
.ring span{font-family:'Share Tech Mono';color:var(--g2);font-size:14px;text-align:center}
@keyframes p{50%{box-shadow:0 0 45px #d4af3799}}@keyframes r{to{transform:rotate(360deg)}}
.s{border-left:2px solid var(--g);padding:8px 12px;margin:16px 0;background:#ffffff08}
.s h2{font-family:'Saira Stencil One';color:var(--g);font-size:18px;margin:0 0 4px;letter-spacing:1px}
.s p{margin:4px 0}.s a{color:#eee;text-decoration:none}.s a:after{content:' ›';color:var(--g)}
.z{font-family:'Share Tech Mono';color:var(--g2);margin-right:6px}.w1{color:var(--g2);font-weight:600}
.m{font-family:'Share Tech Mono';font-size:12px;text-align:center;opacity:.6;margin-top:30px}
</style></head><body><div class="w">
<h1>MORGENBRIEFING</h1><div class="t" id="uhr"></div>
<div class="ring" id="ring"><span id="st">LADE …</span></div>
<div id="inhalt"></div><div class="m" id="probe"></div></div>
<audio id="au"></audio>
<script>
const PROBE={data:"w63O049E5g99BUFKbw==",iv:"b9ca93e7a735b912841e3fa01b9f4774",authTag:"90f43a199d71b0568fe91453a69e09b2"};
const $=id=>document.getElementById(id);
const K=new URLSearchParams(location.hash.slice(1)).get('k')||'';
const hx=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const b6=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let key;
async function dec(o){if(!key)key=await crypto.subtle.importKey('raw',hx(K),'AES-GCM',false,['decrypt']);const c=b6(o.data),t=hx(o.authTag),b=new Uint8Array(c.length+t.length);b.set(c);b.set(t,c.length);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:hx(o.iv)},key,b));}
function uhr(){$('uhr').textContent=new Date().toLocaleString('de-DE',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});}
uhr();setInterval(uhr,30000);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lnk(t,l){return l?'<a href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(t)+'</a>':esc(t);}
function zeige(b){$('inhalt').innerHTML=(b.segmente||[]).map(s=>'<div class="s"><h2>'+esc(s.titel)+'</h2>'+(s.kern?'<p>'+lnk(s.kern,s.link)+'</p>':'')+(s.punkte||[]).map(p=>'<p class="'+(p.wichtig?'w1':'')+'">'+(p.zeit?'<span class="z">'+esc(p.zeit)+'</span>':'')+lnk(p.text,p.link)+'</p>').join('')+'</div>').join('');}
async function start(){
 if(K.length!==64){$('st').textContent='KEIN SCHLÜSSEL';return;}
 try{const p=new TextDecoder().decode(await dec(PROBE));$('probe').textContent=p==='Probe Chef OK'?'SCHLÜSSELPROBE: OK':'SCHLÜSSELPROBE: FALSCH';}catch(e){$('probe').textContent='SCHLÜSSELPROBE: FEHLGESCHLAGEN';}
 try{const r=await fetch('briefing.json?'+Date.now());if(!r.ok)throw 0;const b=JSON.parse(new TextDecoder().decode(await dec(await r.json())));zeige(b);}catch(e){$('inhalt').innerHTML='<div class="s"><p>Noch kein Briefing für heute.</p></div>';}
 try{const r=await fetch('audio.json?'+Date.now());if(!r.ok)throw 0;const a=await dec(await r.json());$('au').src=URL.createObjectURL(new Blob([a],{type:'audio/mpeg'}));$('st').innerHTML='TIPPEN<br>ZUM ABSPIELEN';$('au').play().then(()=>{$('st').textContent='LÄUFT';}).catch(()=>{});}catch(e){$('st').textContent='KEINE AUFNAHME';}
}
$('ring').onclick=()=>{const a=$('au');if(!a.src)return;if(a.paused){a.play();$('st').textContent='LÄUFT';}else{a.pause();$('st').textContent='PAUSE';}};
$('au').onended=()=>{$('st').textContent='ENDE';};
start();
</script></body></html>
